<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Page introuvable — Evyron</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --bg: #ffffff; --tx: #111111; --tx2: #555555; --mu: #999999; --br: #e8e8e8; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--tx);
      line-height: 1.75;
      -webkit-font-smoothing: antialiased;
      font-weight: 400;
      letter-spacing: -.01em;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    a { color: inherit; text-decoration: none; }
    ::selection { background: #111; color: #fff; }

    nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      padding: 1.5rem 3rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, .9);
      backdrop-filter: blur(20px);
    }
    .nv-logo { font-size: 1.1rem; font-weight: 600; letter-spacing: -.02em; }
    .nv-links { display: flex; gap: 2.5rem; list-style: none; }
    .nv-links a {
      font-size: .8rem;
      font-weight: 500;
      color: var(--mu);
      transition: color .3s;
      letter-spacing: .02em;
      text-transform: uppercase;
    }
    .nv-links a:hover { color: var(--tx); }

    .error-page {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8rem 2rem 4rem;
    }
    .error-code {
      font-family: Playfair Display, serif;
      font-size: clamp(6rem, 15vw, 12rem);
      font-weight: 400;
      line-height: 1;
      letter-spacing: -.04em;
      color: var(--br);
      margin-bottom: 1rem;
    }
    .error-msg {
      font-family: Playfair Display, serif;
      font-size: clamp(1.5rem, 3vw, 2rem);
      font-weight: 400;
      margin-bottom: 1.5rem;
      letter-spacing: -.02em;
    }
    .error-desc {
      color: var(--tx2);
      font-size: .95rem;
      font-weight: 300;
      max-width: 420px;
      margin-bottom: 3rem;
      line-height: 1.8;
    }
    .error-line {
      width: 40px;
      height: 1px;
      background: var(--tx);
      margin: 0 auto 3rem;
    }
    .error-link {
      font-size: .8rem;
      font-weight: 500;
      color: var(--tx);
      border-bottom: 1px solid var(--tx);
      padding-bottom: 2px;
      transition: opacity .3s;
      text-transform: uppercase;
      letter-spacing: .02em;
    }
    .error-link:hover { opacity: .5; }

    footer {
      border-top: 1px solid var(--br);
      padding: 3rem 3rem 2rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }
    .ft-c {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 1.5rem;
      text-align: center;
    }
    .ft-logo { font-size: 1rem; font-weight: 600; letter-spacing: -.02em; }
    .ft-links { display: flex; gap: 2rem; }
    .ft-links a {
      font-size: .75rem;
      color: var(--mu);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: .08em;
      transition: color .3s;
    }
    .ft-links a:hover { color: var(--tx); }
    .ft-legal {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }
    .ft-legal a {
      font-size: .7rem;
      color: var(--mu);
      font-weight: 400;
      transition: color .3s;
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .ft-legal a:hover { color: var(--tx); }
    .ft-btm {
      text-align: center;
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--br);
      color: var(--mu);
      font-size: .75rem;
      font-weight: 300;
      letter-spacing: .02em;
    }

    @media (max-width: 900px) {
      .nv-links { display: none; }
      .ft-c { flex-direction: column; text-align: center; }
      .ft-links { flex-wrap: wrap; justify-content: center; }
    }
    @media (max-width: 500px) {
      nav { padding: 1rem 1.5rem; }
    }
  </style>
</head>

<body>
  <nav>
    <a href="index.html" class="nv-logo">Evyron</a>
    <ul class="nv-links">
      <li><a href="index.html#services">Services</a></li>
      <li><a href="index.html#about">À propos</a></li>
      <li><a href="index.html#contact">Contact</a></li>
    </ul>
  </nav>

  <div class="error-page">
    <div class="error-code">404</div>
    <h1 class="error-msg">Page introuvable</h1>
    <p class="error-desc">La page que vous recherchez n'existe pas ou a été déplacée.</p>
    <div class="error-line"></div>
    <a href="index.html" class="error-link">Retour à l'accueil</a>
  </div>

  <footer>
    <div class="ft-c">
      <div class="ft-logo">Evyron</div>
      <div class="ft-links">
        <a href="index.html#services">Services</a>
        <a href="index.html#about">À propos</a>
        <a href="index.html#contact">Contact</a>
      </div>
      <div class="ft-legal">
        <a href="mentions-legales.html">Mentions légales</a>
        <a href="politique-de-confidentialite.html">Politique de confidentialité</a>
        <a href="cgv.html">CGV</a>
        <a href="politique-de-cookies.html">Cookies</a>
      </div>
    </div>
    <div class="ft-btm">
      <p>&copy; 2026 Evyron. Tous droits réservés.</p>
    </div>
  </footer>
</body>
</html>
